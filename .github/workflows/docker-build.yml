
name: Docker Build, Test and Publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-test-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/alishoaip111am-arch/shadowsaas-radar:latest
            ghcr.io/alishoaip111am-arch/shadowsaas-radar:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/alishoaip111am-arch/ShadowSaaS-Radar

      - name: Pull published image
        run: |
          docker pull ghcr.io/alishoaip111am-arch/shadowsaas-radar:latest

      - name: Run Docker container
        run: |
          docker run -d \
            --name shadowsaas-test \
            -p 8000:8000 \
            ghcr.io/alishoaip111am-arch/shadowsaas-radar:latest

      - name: Wait for application health
        run: |
          for i in $(seq 1 30); do
            if curl --fail http://localhost:8000/api/health; then
              echo "Health check passed"
              exit 0
            fi
            sleep 2
          done
          echo "Health check failed"
          docker logs shadowsaas-test
          exit 1

      - name: Test API response
        run: |
          curl --fail http://localhost:8000/api/health

      - name: Verify frontend response
        run: |
          curl --fail http://localhost:8000/

      - name: Cleanup
        if: always()
        run: |
          docker logs shadowsaas-test || true
          docker rm -f shadowsaas-test || true
