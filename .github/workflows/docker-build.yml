
name: Docker Build and Runtime Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: shadowsaas-radar:test

      - name: Run Docker container
        run: |
          docker run -d \
            --name shadowsaas-test \
            -p 8000:8000 \
            shadowsaas-radar:test

      - name: Wait for application health
        run: |
          for i in $(seq 1 30); do
            if curl --fail http://localhost:8000/api/health; then
              echo "Health check passed"
              exit 0
            fi
            sleep 2
          done
          echo "Health check failed"
          docker logs shadowsaas-test
          exit 1

      - name: Test API response
        run: |
          curl --fail http://localhost:8000/api/health

      - name: Verify frontend response
        run: |
          curl --fail http://localhost:8000/

      - name: Cleanup
        if: always()
        run: |
          docker logs shadowsaas-test || true
          docker rm -f shadowsaas-test || true
